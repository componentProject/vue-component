packages:
  - packages/*
  - play/*
  - docs/*

# 该分类仅包含多pack共用依赖
catalogs:
  build:
    #element-plus
    element-plus: ^2.10.1
    '@element-plus/icons-vue': ^2.3.1
    #formily
    '@formily/core': ^2.3.7
    '@formily/grid': ^2.1.5
    '@formily/json-schema': ^2.3.7
    '@formily/reactive': ^2.1.5
