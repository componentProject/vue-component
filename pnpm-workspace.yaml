    '@formily/vue': ^2.3.7
    #其他
    axios: ^1.9.0
    dayjs: ^1.11.13
    lodash: npm:lodash-es@4.17.21
    moment: ^2.30.1
    radash: ^12.1.0
    uuid: ^11.1.0
    vuedraggable: ^4.1.0
    vue: ^3.5.13
    'vue-i18n': ^11.1.1
    'vue-router': 4.5.0
    'vxe-table': 4.13.39
    'crypto-js': ^4.2.0
    'pinia': 2.3.0
